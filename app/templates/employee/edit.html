{% extends 'base.html' %}

{% block title %}Chỉnh sửa Nhân viên{% endblock %}
{% block header_title %}Chỉnh sửa thông tin Nhân sự{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
            <div class="card-header bg-white py-3 px-4 border-0">
                <h5 class="fw-bold m-0 text-dark"><i class="fa-solid fa-user-pen me-2" style="color: #0f766e;"></i>Cập nhật thông tin: {{ emp.full_name }}</h5>
            </div>
            <div class="card-body px-4 pb-4">
                <form action="{{ url_for('employee.edit', id=emp.id) }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted">Mã nhân viên</label>
                        <input type="text" name="employee_code" class="form-control rounded-pill" value="{{ emp.employee_code }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted">Họ và tên</label>
                        <input type="text" name="full_name" class="form-control rounded-pill" value="{{ emp.full_name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted">Email liên hệ</label>
                        <input type="email" name="email" class="form-control rounded-pill" value="{{ emp.email }}" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold small text-muted">Phòng ban</label>
                        <input type="text" name="department" class="form-control rounded-pill" value="{{ emp.department }}" required>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('employee.index') }}" class="btn btn-outline-secondary rounded-pill px-4">
                            <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
                        </a>
                        <button type="submit" class="btn text-white rounded-pill px-4 shadow-sm fw-bold" style="background-color: #0f766e;">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Lưu thay đổi
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
