{% extends 'base.html' %}

{% block title %}Chỉnh sửa Công việc{% endblock %}
{% block header_title %}Chỉnh sửa thông tin Công việc{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
            <div class="card-header bg-white py-3 px-4 border-0">
                <h5 class="fw-bold m-0 text-dark"><i class="fa-solid fa-pen-to-square me-2" style="color: #0891b2;"></i>Cập nhật công việc: {{ task.title }}</h5>
            </div>
            <div class="card-body px-4 pb-4">
                <form action="{{ url_for('task.edit', id=task.id) }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted">Mã công việc</label>
                        <input type="text" name="task_code" class="form-control rounded-pill" value="{{ task.task_code }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted">Tên công việc</label>
                        <input type="text" name="title" class="form-control rounded-pill" value="{{ task.title }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted">Mô tả chi tiết</label>
                        <textarea name="description" class="form-control rounded-4" rows="3">{{ task.description }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted">Độ ưu tiên</label>
                        <select name="priority" class="form-select rounded-pill">
                            <option value="Cao" {% if task.priority == 'Cao' %}selected{% endif %}>Cao</option>
                            <option value="Trung bình" {% if task.priority == 'Trung bình' %}selected{% endif %}>Trung bình</option>
                            <option value="Thấp" {% if task.priority == 'Thấp' %}selected{% endif %}>Thấp</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold small text-muted">Thời lượng (giờ)</label>
                        <input type="number" step="0.1" name="duration" class="form-control rounded-pill" value="{{ task.duration }}" required>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('task.index') }}" class="btn btn-outline-secondary rounded-pill px-4">
                            <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
                        </a>
                        <button type="submit" class="btn text-white rounded-pill px-4 shadow-sm fw-bold" style="background-color: #0891b2;">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Lưu thay đổi
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
